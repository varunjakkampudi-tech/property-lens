name: Validate and deploy Property Lens

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript and required SEO files
        shell: bash
        run: |
          set -euo pipefail
          node --check data/properties.js
          node --check assets/app.js
          node --check assets/enrichment.js
          node --check assets/mobile-location.js
          test -s index.html
          test -s robots.txt
          test -s sitemap.xml
          test -s manifest.webmanifest
          test -s assets/favicon.svg
          grep -q 'rel="canonical"' index.html
          grep -q 'application/ld+json' index.html
          grep -q 'mobile-location.js' index.html

      - name: Build clean static artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html 404.html robots.txt sitemap.xml manifest.webmanifest .nojekyll _site/
          cp -R assets data _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
