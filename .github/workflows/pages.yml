name: Production E2E and deploy Property Lens

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate static source
        shell: bash
        run: |
          set -euo pipefail
          node --check data/properties.js
          node --check assets/app.js
          node --check assets/enrichment.js
          node --check assets/mobile-location.js
          test -s index.html
          test -s robots.txt
          test -s sitemap.xml
          test -s manifest.webmanifest
          test -s assets/favicon.svg

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install E2E tooling
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/property-lens-server.log 2>&1 &
          echo $! > /tmp/property-lens-server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/property-lens-server.log
          exit 1

      - name: Run mobile, desktop and accessibility E2E
        run: npm run test:e2e

      - name: Upload visual test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-lens-visual-e2e
          if-no-files-found: warn
          path: |
            visual-*.png
            playwright-report/
            test-results/
          retention-days: 7

      - name: Build clean Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html 404.html robots.txt sitemap.xml manifest.webmanifest .nojekyll _site/
          cp -R assets data _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
