name: Pull request quality

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source and data
        run: |
          npm run test:syntax
          npm run test:data
          npm run test:unit
          test -s index.html
          test -s robots.txt
          test -s sitemap.xml
          test -s manifest.webmanifest
          test -s assets/favicon.svg
          test -s assets/core.js
          test -s docs/diagrams/system-architecture.svg
          test -s docs/diagrams/lead-lifecycle.svg
      - name: Install browser tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Mobile, desktop and accessibility E2E
        run: npm run test:e2e
      - name: Upload test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: property-lens-pr-e2e
          if-no-files-found: warn
          path: |
            visual-*.png
            playwright-report/
            test-results/
          retention-days: 7
