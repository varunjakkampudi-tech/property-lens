name: Pull request quality

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: property-lens-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Validate source and data
        run: |
          npm run test:syntax
          npm run test:data
          npm run test:unit
          test -s index.html
          test -s robots.txt
          test -s sitemap.xml
          test -s manifest.webmanifest
          test -s assets/favicon.svg
          test -s assets/core.js
          test -s assets/icons.svg
          test -s assets/design-refresh.css
          test -s package-lock.json
          test -s docs/diagrams/system-architecture.svg
          test -s docs/diagrams/lead-lifecycle.svg
      - name: Install browser tests
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high --no-fund
          npx playwright install --with-deps chromium
      - name: Mobile, desktop and accessibility E2E
        run: npm run test:e2e
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: property-lens-pr-e2e
          if-no-files-found: warn
          path: |
            visual-*.png
            playwright-report/
            test-results/
          retention-days: 7
