name: Pull request quality

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source and data
        run: |
          npm run test:syntax
          npm run test:data
          test -s index.html
          test -s robots.txt
          test -s sitemap.xml
          test -s manifest.webmanifest
          test -s assets/favicon.svg
      - name: Install browser tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/property-lens-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/property-lens-server.log
          exit 1
      - name: Mobile, desktop and accessibility E2E
        run: npm run test:e2e
      - name: Upload test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: property-lens-pr-e2e
          if-no-files-found: warn
          path: |
            visual-*.png
            playwright-report/
            test-results/
          retention-days: 7
