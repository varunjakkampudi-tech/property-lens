name: Approved-feed discovery publisher

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: property-lens-scheduled-discovery
  cancel-in-progress: false

jobs:
  discover-and-propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCOVERY_FEED_URL: ${{ secrets.PROPERTY_DISCOVERY_FEED_URL }}
      DISCOVERY_FEED_TOKEN: ${{ secrets.PROPERTY_DISCOVERY_FEED_TOKEN }}
      PROPERTY_PUBLISHER_TOKEN: ${{ secrets.PROPERTY_PUBLISHER_TOKEN }}
      DISCOVERY_OUTPUT: artifacts/discovery-run.json
      PROPOSED_DATA: artifacts/proposed-properties.js
      PROPOSED_REVIEW_QUEUE: artifacts/proposed-review-queue.json
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Do not leave the default GITHUB_TOKEN available to git push.
          # Publishing must use the dedicated publisher credential below.
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install deterministic test dependencies
        run: npm ci --no-audit --no-fund
      - name: Discover and validate approved feed
        run: node scripts/discovery.cjs
      - name: Build data-only proposal when evidence changed
        id: proposal
        shell: bash
        run: |
          set -euo pipefail
          status="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('artifacts/discovery-run.json')).status)")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" == "changes_found" ]]; then
            node scripts/publish-data.cjs
            cp artifacts/proposed-properties.js data/properties.js
            cp artifacts/proposed-review-queue.json data/review-queue.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run release gates for a proposed data release
        if: steps.proposal.outputs.changed == 'true'
        run: |
          npx playwright install --with-deps chromium
          npm run test:quality
      - name: Create authorized data-only pull request
        if: steps.proposal.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROPERTY_PUBLISHER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::PROPERTY_PUBLISHER_TOKEN is required. GITHUB_TOKEN-created PRs do not trigger the normal PR workflow. Configure a narrowly scoped GitHub App or PAT secret.";
            exit 1;
          fi
          # Use the dedicated publisher credential for git push as well as PR creation.
          # gh configures its credential helper without exposing the token in the remote URL.
          gh auth setup-git
          branch="automation/property-data-${GITHUB_RUN_ID}"
          git config user.name "property-lens-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Reruns reuse the same run id. Reuse that branch safely instead of
          # failing because the first attempt already pushed it.
          git fetch origin "$branch" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git switch -C "$branch" "origin/$branch"
          else
            git switch -c "$branch"
          fi
          git add data/properties.js data/review-queue.json
          git diff --cached --quiet && { echo "No material data change after normalization."; exit 0; }
          git commit -m "data: publish evidence-backed property leads"
          git push --set-upstream origin "$branch" --force-with-lease
          pr_url="$(gh pr list --base main --head "$branch" --state open --json url --jq '.[0].url')"
          if [[ -z "$pr_url" ]]; then
            for attempt in 1 2 3; do
              if pr_url="$(gh pr create --base main --head "$branch" --title "data: review scheduled property discovery" --body "Automated evidence-first discovery proposal. Full release gates passed before opening this PR. Review source provenance and merge only under repository branch protection. Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"; then
                break
              fi
              [[ "$attempt" -lt 3 ]] && sleep $((attempt * 5))
            done
          fi
          [[ -n "$pr_url" ]] || { echo "::error::Unable to create or locate the scheduled discovery PR after retries."; exit 1; }
          echo "Created data-only PR: $pr_url"
          merged=false
          for attempt in 1 2 3; do
            if gh pr merge "$pr_url" --auto --squash --delete-branch; then
              merged=true
              break
            fi
            [[ "$attempt" -lt 3 ]] && sleep $((attempt * 5))
          done
          [[ "$merged" == true ]] || { echo "::error::Unable to enable protected auto-merge after retries."; exit 1; }
      - name: Write execution summary
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'artifacts/discovery-run.json';
          if (!fs.existsSync(file)) process.exit(0);
          const run = JSON.parse(fs.readFileSync(file));
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Scheduled discovery\n\n- Status: \`${run.status}\`\n- Approved feed configured: ${run.feedConfigured}\n- Accepted records: ${run.accepted.length}\n- Rejected records: ${run.rejected.length}\n- No-feed runs are successful no-ops; they never create commits.\n- A PR is created only after a material change passes the full release gates.\n`);
          NODE
      - name: Upload persistent execution record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: property-lens-discovery-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
