<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Property Lens system architecture</title><desc id="desc">Public discovery and human review feed a versioned review queue and validated listing data. GitHub Actions tests and deploys a static site. Browser interfaces use local storage for private notes and shortlist.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient></defs><rect width="1200" height="680" fill="url(#bg)"/><text x="44" y="62" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="32" fill="#0f172a" font-weight="800">Property Lens · System architecture</text><text x="44" y="94" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#475569" font-weight="400">Static-first delivery · data-only lead updates · no runtime API or secrets</text><rect x="36" y="128" width="360" height="462" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="164" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#1d4ed8" font-weight="800">DISCOVERY &amp; REVIEW</text><text x="60" y="189" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#64748b" font-weight="400">External, permissioned sources</text><rect x="420" y="128" width="360" height="462" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="444" y="164" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#1d4ed8" font-weight="800">DATA &amp; RELEASE GATES</text><text x="444" y="189" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#64748b" font-weight="400">Versioned repository</text><rect x="804" y="128" width="360" height="462" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="828" y="164" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#1d4ed8" font-weight="800">STATIC DELIVERY</text><text x="828" y="189" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#64748b" font-weight="400">GitHub Pages + browser</text><rect x="60" y="214" width="312" height="92" rx="12" fill="#f8fafc" stroke="#dbeafe" stroke-width="1.5"/><text x="76" y="244" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#0f172a" font-weight="750">Public source discovery</text><text x="76" y="269" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">Instagram Reels · Shorts · portals</text><text x="76" y="291" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">Direct URLs and published metadata</text><rect x="60" y="326" width="312" height="92" rx="12" fill="#eff6ff" stroke="#dbeafe" stroke-width="1.5"/><text x="76" y="356" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#0f172a" font-weight="750">Hourly ChatGPT review</text><text x="76" y="381" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">Tool- and permission-dependent</text><text x="76" y="403" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">No private feed or scraping bypass</text><rect x="60" y="438" width="312" height="92" rx="12" fill="#f8fafc" stroke="#dbeafe" stroke-width="1.5"/><text x="76" y="468" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#0f172a" font-weight="750">Human / evidence review</text><text x="76" y="493" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">Corroborate price and availability</text><text x="76" y="515" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">Reject duplicates and private data</text><rect x="444" y="214" width="312" height="92" rx="12" fill="#f8fafc" stroke="#dbeafe" stroke-width="1.5"/><text x="460" y="244" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#0f172a" font-weight="750">Review queue</text><text x="460" y="269" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">Unknown, conflicting or out-of-budget</text><text x="460" y="291" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">data/review-queue.json</text><rect x="444" y="326" width="312" height="92" rx="12" fill="#eff6ff" stroke="#dbeafe" stroke-width="1.5"/><text x="460" y="356" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#0f172a" font-weight="750">Public lead dataset</text><text x="460" y="381" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">Under ₹50L; source-backed</text><text x="460" y="403" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">data/properties.js</text><rect x="444" y="438" width="312" height="92" rx="12" fill="#f8fafc" stroke="#dbeafe" stroke-width="1.5"/><text x="460" y="468" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#0f172a" font-weight="750">GitHub Actions quality gate</text><text x="460" y="493" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">Syntax · data · unit · E2E · axe</text><text x="460" y="515" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">Release only after all pass</text><rect x="828" y="214" width="312" height="92" rx="12" fill="#eff6ff" stroke="#dbeafe" stroke-width="1.5"/><text x="844" y="244" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#0f172a" font-weight="750">GitHub Pages</text><text x="844" y="269" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">Versioned, HTTPS static artifact</text><text x="844" y="291" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">Verified deployed commit</text><rect x="828" y="326" width="312" height="92" rx="12" fill="#f8fafc" stroke="#dbeafe" stroke-width="1.5"/><text x="844" y="356" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#0f172a" font-weight="750">Responsive interfaces</text><text x="844" y="381" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">Desktop + mobile location flow</text><text x="844" y="403" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">Shared core, accessible controls</text><rect x="828" y="438" width="312" height="92" rx="12" fill="#f8fafc" stroke="#dbeafe" stroke-width="1.5"/><text x="844" y="468" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#0f172a" font-weight="750">Browser-local state</text><text x="844" y="493" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">Shortlist · visited · notes</text><text x="844" y="515" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">No accounts or server-side storage</text><path d="M372 368H438" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M756 368H822" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="46" y="628" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#1d4ed8" font-weight="800">TRUST BOUNDARY</text><text x="185" y="628" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#334155" font-weight="500">A public advertisement is a discovery lead, not proof that a property is unsold.</text><text x="46" y="655" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#64748b" font-weight="400">Operations: source-backed changes → data-only PR/commit → tests → deployment → live commit verification.</text></svg>