<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Property Lens lead lifecycle</title><desc id="desc">A public lead is discovered, checked for provenance and price, corroborated, validated and deployed. Unconfirmed or conflicting records stay in the review queue. Published leads are rechecked and retired when closure is reliably confirmed.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient></defs><rect width="1200" height="640" fill="url(#bg)"/><text x="40" y="62" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="32" fill="#0f172a" font-weight="800">Property Lens · Lead lifecycle</text><text x="40" y="94" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#475569" font-weight="400">Two-hour discovery, evidence-first publication and safe retirement</text><rect x="30" y="174" width="188" height="156" rx="16" fill="#fff" stroke="#bfdbfe" stroke-width="1.5"/><text x="46" y="208" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#2563eb" font-weight="800">01</text><text x="46" y="244" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#0f172a" font-weight="750">Discover</text><text x="46" y="273" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">Public Reel, Short</text><text x="46" y="295" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">or property portal</text><rect x="268" y="174" width="188" height="156" rx="16" fill="#fff" stroke="#bfdbfe" stroke-width="1.5"/><text x="284" y="208" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#2563eb" font-weight="800">02</text><text x="284" y="244" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#0f172a" font-weight="750">Capture evidence</text><text x="284" y="273" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">Direct URL, date, poster</text><text x="284" y="295" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">city, category, price</text><rect x="506" y="174" width="188" height="156" rx="16" fill="#fff" stroke="#bfdbfe" stroke-width="1.5"/><text x="522" y="208" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#2563eb" font-weight="800">03</text><text x="522" y="244" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#0f172a" font-weight="750">Corroborate</text><text x="522" y="273" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">Check asking price</text><text x="522" y="295" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">and availability signals</text><rect x="744" y="174" width="188" height="156" rx="16" fill="#fff" stroke="#bfdbfe" stroke-width="1.5"/><text x="760" y="208" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#2563eb" font-weight="800">04</text><text x="760" y="244" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#0f172a" font-weight="750">Validate &amp; test</text><text x="760" y="273" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">Deduplicate; data checks</text><text x="760" y="295" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">unit, E2E, accessibility</text><rect x="982" y="174" width="188" height="156" rx="16" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/><text x="998" y="208" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#2563eb" font-weight="800">05</text><text x="998" y="244" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#0f172a" font-weight="750">Publish &amp; recheck</text><text x="998" y="273" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">GitHub Pages deployment</text><text x="998" y="295" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">two-hour evidence review</text><path d="M222 252H262" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M460 252H500" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M698 252H738" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M936 252H976" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="300" y="400" width="600" height="126" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="324" y="435" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#9a3412" font-weight="800">REVIEW QUEUE · NOT SHOWN AS CONFIRMED AVAILABILITY</text><text x="324" y="465" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">Unknown price, conflicting size, social-only discovery or uncertain status</text><text x="324" y="487" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#475569" font-weight="400">Preserve source and reason; publish only after the required evidence is obtained.</text><path d="M600 333V394" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="38" y="580" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#1d4ed8" font-weight="800">Retirement rule:</text><text x="164" y="580" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#334155" font-weight="500">Remove a lead only with reliable sold, closed, duplicate or invalid evidence.</text><text x="38" y="610" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#64748b" font-weight="400">Automation changes listing data and the review queue; application code is frozen after final release.</text></svg>
